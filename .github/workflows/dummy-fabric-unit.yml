name: Unit tests — dummy_fabric

on:
  workflow_dispatch:

concurrency:
  group: dummy-fabric-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (systems/dummy_fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PIPENV_PIPFILE: config/Pipfile
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipenv & dependencies
        run: |
          set -eu
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pipenv
          pipenv install --dev

      - name: Run dummy_fabric unit tests
        run: |
          pipenv run pytest -c config/pyproject.toml \
            systems/dummy_fabric/tests/test_unit.py \
            -v --tb=short

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dummy-fabric-unit-reports
          path: "**/pytest-report*.xml"
          if-no-files-found: ignore
