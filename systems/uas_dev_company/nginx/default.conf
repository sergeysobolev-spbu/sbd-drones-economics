server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    location /api/ {
        set $api_upstream api_gateway;
        proxy_pass http://$api_upstream:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        set $api_upstream api_gateway;
        proxy_pass http://$api_upstream:8081/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Переменная + resolver: иначе web_portal резолвится один раз при старте nginx и даёт 502,
    # если контейнер ещё не был в DNS Docker.
    location / {
        set $web_upstream web_portal;
        proxy_pass http://$web_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
