      - DRONE_ANALYTICS_URL=${DRONE_ANALYTICS_URL:-}
      - DRONE_ANALYTICS_API_KEY=${DRONE_ANALYTICS_API_KEY:-}
      - UAS_DRONE_ANALYTICS_TRANSPORT=${UAS_DRONE_ANALYTICS_TRANSPORT:-http}
