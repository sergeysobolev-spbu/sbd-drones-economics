# Только сервисы системы UAS Dev Company; брокер подмешивает prepare_system.py.
services:
  api_gateway:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/src/gateway/docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - COMPONENT_ID=api_gateway
      - UAS_GATEWAY_BACKEND=bus
      - BACKEND_PORT=8081
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/systems/uas_dev_company/resources/uas_dev_company.sqlite3}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - DRONE_ANALYTICS_URL=${DRONE_ANALYTICS_URL:-}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - JWT_SECRET=${JWT_SECRET:-uas_dev_company_dev_jwt_change_me_in_production}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - GATEWAY_MONITOR_REQUEST_TIMEOUT_S=${GATEWAY_MONITOR_REQUEST_TIMEOUT_S:-120}
      - GATEWAY_AUTH_PROXY_TIMEOUT_S=${GATEWAY_AUTH_PROXY_TIMEOUT_S:-25}
    volumes:
      - uas_dev_company_data:/app/systems/uas_dev_company/resources
    networks:
      - drones_net
    restart: unless-stopped

  security_monitor:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/src/security_monitor/docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - COMPONENT_ID=security_monitor
      - POLICY_ADMIN_SENDER=${POLICY_ADMIN_SENDER:-components.api_gateway}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - SECURITY_MONITOR_PROXY_REQUEST_TIMEOUT_S=${SECURITY_MONITOR_PROXY_REQUEST_TIMEOUT_S:-120}
    networks:
      - drones_net
    restart: unless-stopped

  user_management_worker:
