# Только сервисы системы UAS Dev Company; брокер подмешивает prepare_system.py.
# Задача 23: отдельный named volume на домен (только свой data.sqlite3 в контейнере).

services:
  api_gateway:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/src/gateway/docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - COMPONENT_ID=api_gateway
      - UAS_GATEWAY_BACKEND=bus
      - BACKEND_PORT=8081
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - DRONE_ANALYTICS_URL=${DRONE_ANALYTICS_URL:-}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - JWT_SECRET=${JWT_SECRET:-uas_dev_company_dev_jwt_change_me_in_production}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - GATEWAY_MONITOR_REQUEST_TIMEOUT_S=${GATEWAY_MONITOR_REQUEST_TIMEOUT_S:-120}
      - GATEWAY_AUTH_PROXY_TIMEOUT_S=${GATEWAY_AUTH_PROXY_TIMEOUT_S:-60}
    networks:
      - drones_net
    restart: unless-stopped

  # Толстый шлюз с UAS_GATEWAY_BACKEND=sqlite (все домены в образе). Профиль dev — не профиль bus.
  api_gateway_sqlite:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/src/gateway/docker/Dockerfile.sqlite
    profiles: ["sqlite-dev"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - COMPONENT_ID=api_gateway_sqlite
      - UAS_GATEWAY_BACKEND=sqlite
      - BACKEND_PORT=8082
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - DRONE_ANALYTICS_URL=${DRONE_ANALYTICS_URL:-}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - JWT_SECRET=${JWT_SECRET:-uas_dev_company_dev_jwt_change_me_in_production}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - GATEWAY_MONITOR_REQUEST_TIMEOUT_S=${GATEWAY_MONITOR_REQUEST_TIMEOUT_S:-120}
      - GATEWAY_AUTH_PROXY_TIMEOUT_S=${GATEWAY_AUTH_PROXY_TIMEOUT_S:-60}
    volumes:
      - uas_domain_user_management:/app/systems/uas_dev_company/resources/domains/user_management
      - uas_domain_firmware_ingestion:/app/systems/uas_dev_company/resources/domains/firmware_ingestion
      - uas_domain_certification_service:/app/systems/uas_dev_company/resources/domains/certification_service
      - uas_domain_drone_registry:/app/systems/uas_dev_company/resources/domains/drone_registry
      - uas_domain_purchase_service:/app/systems/uas_dev_company/resources/domains/purchase_service
      - uas_domain_audit_log:/app/systems/uas_dev_company/resources/domains/audit_log
      - uas_domain_analytics_adapter:/app/systems/uas_dev_company/resources/domains/analytics_adapter
    networks:
      - drones_net
    restart: unless-stopped

  security_monitor:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/src/security_monitor/docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - COMPONENT_ID=security_monitor
      - POLICY_ADMIN_SENDER=${POLICY_ADMIN_SENDER:-components.api_gateway}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
      - SECURITY_MONITOR_PROXY_REQUEST_TIMEOUT_S=${SECURITY_MONITOR_PROXY_REQUEST_TIMEOUT_S:-120}
    networks:
      - drones_net
    restart: unless-stopped

  user_management_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: user_management
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=user_management_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_user_management:/app/systems/uas_dev_company/resources/domains/user_management
    networks:
      - drones_net
    restart: unless-stopped

  firmware_ingestion_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: firmware_ingestion
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=firmware_ingestion_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_firmware_ingestion:/app/systems/uas_dev_company/resources/domains/firmware_ingestion
    networks:
      - drones_net
    restart: unless-stopped

  certification_service_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: certification_service
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=certification_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_certification_service:/app/systems/uas_dev_company/resources/domains/certification_service
    networks:
      - drones_net
    restart: unless-stopped

  drone_registry_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: drone_registry
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=drone_registry_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_drone_registry:/app/systems/uas_dev_company/resources/domains/drone_registry
    networks:
      - drones_net
    restart: unless-stopped

  purchase_service_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: purchase_service
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=purchase_service_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_purchase_service:/app/systems/uas_dev_company/resources/domains/purchase_service
    networks:
      - drones_net
    restart: unless-stopped

  audit_log_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: audit_log
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=audit_log_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_audit_log:/app/systems/uas_dev_company/resources/domains/audit_log
    networks:
      - drones_net
    restart: unless-stopped

  analytics_adapter_worker:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/docker/worker.Dockerfile
      args:
        DOMAIN: analytics_adapter
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_NAME=uas_dev_company
      - COMPONENT_ID=analytics_adapter_worker
      - UAS_DOMAIN_DATA_ROOT=${UAS_DOMAIN_DATA_ROOT:-/app/systems/uas_dev_company/resources/domains}
      - DRONE_ANALYTICS_ENABLED=${DRONE_ANALYTICS_ENABLED:-false}
      - DRONE_ANALYTICS_URL=${DRONE_ANALYTICS_URL:-}
      - DRONE_ANALYTICS_API_KEY=${DRONE_ANALYTICS_API_KEY:-}
      - UAS_DRONE_ANALYTICS_TRANSPORT=${UAS_DRONE_ANALYTICS_TRANSPORT:-http}
      - UAS_EXTERNAL_SYSTEMS_TRANSPORT=${UAS_EXTERNAL_SYSTEMS_TRANSPORT:-none}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    volumes:
      - uas_domain_analytics_adapter:/app/systems/uas_dev_company/resources/domains/analytics_adapter
    networks:
      - drones_net
    restart: unless-stopped

  web_portal:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/web/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    networks:
      - drones_net
    restart: unless-stopped

  nginx_reverse_proxy:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/nginx/Dockerfile
    profiles: ["kafka", "mqtt"]
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api_gateway
      - web_portal
    networks:
      - drones_net
    restart: unless-stopped

volumes:
  uas_domain_user_management:
  uas_domain_firmware_ingestion:
  uas_domain_certification_service:
  uas_domain_drone_registry:
  uas_domain_purchase_service:
  uas_domain_audit_log:
  uas_domain_analytics_adapter:

networks:
  drones_net:
    external: true
    name: ${DOCKER_NETWORK:-drones_net}
