  nginx_reverse_proxy:
    build:
      context: ../..
      dockerfile: systems/uas_dev_company/nginx/Dockerfile
    profiles: ["kafka", "mqtt"]
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api_gateway
      - web_portal
    networks:
      - drones_net
    restart: unless-stopped

volumes:
  uas_dev_company_data:

networks:
  drones_net:
    external: true
    name: ${DOCKER_NETWORK:-drones_net}
