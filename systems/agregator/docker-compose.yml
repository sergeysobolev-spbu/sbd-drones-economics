# Docker Compose для Agregator.
# Только сервисы компонентов. Брокер запускается отдельно (docker/docker-compose.yml).
# Этот файл НЕ используется напрямую — его собирает scripts/prepare_system.py.

services:
  agregator_component:
    build:
      context: ../..
      dockerfile: systems/agregator/src/agregator_component/docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - COMPONENT_ID=agregator_component
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${COMPONENT_USER:-${ADMIN_USER:-admin}}
      - BROKER_PASSWORD=${COMPONENT_PASSWORD:-${ADMIN_PASSWORD:-admin123}}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JOURNAL_TOPIC=${JOURNAL_TOPIC:-components.agregator.journal}
      - PYTHONUNBUFFERED=1
    networks:
      - drones_net
    restart: unless-stopped

  agregator_gateway:
    build:
      context: ../..
      dockerfile: systems/agregator/src/gateway/docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - SYSTEM_ID=agregator
      - SYSTEM_NAMESPACE=${SYSTEM_NAMESPACE:-}
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - HEALTH_PORT=8080
      - JOURNAL_TOPIC=${JOURNAL_TOPIC:-components.agregator.journal}
      - PYTHONUNBUFFERED=1
    ports:
      - "${AGREGATOR_PORT:-8080}:8080"
    networks:
      - drones_net
    restart: unless-stopped

  agregator_journal:
    build:
      context: ../..
      dockerfile: sdk/journal_docker/Dockerfile
    profiles: ["kafka", "mqtt"]
    environment:
      - COMPONENT_ID=agregator_journal
      - JOURNAL_TOPIC=components.agregator.journal
      - ANALYTICS_URL=${ANALYTICS_URL:-}
      - ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-}
      - ANALYTICS_SERVICE_NAME=aggregator
      - ANALYTICS_SERVICE_ID=1
      - BROKER_TYPE=${BROKER_TYPE:-kafka}
      - BROKER_USER=${ADMIN_USER:-admin}
      - BROKER_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    networks:
      - drones_net
    restart: unless-stopped

networks:
  drones_net:
    external: true
    name: ${DOCKER_NETWORK:-drones_net}
