[pytest]
# Настройка путей для правильной работы импортов
pythonpath = . ../.. ../../..
testpaths = tests src

# Настройки для покрытия кода
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=30

# Маркеры для тестов
markers =
    unit: Unit tests for individual components
    module: Module tests for component interactions
    integration: Integration tests with external systems
    e2e: End-to-end tests
    slow: Tests that take a long time to run
    security: Security-related tests

# Настройки для асинхронных тестов
asyncio_mode = auto

# Игнорировать предупреждения от сторонних библиотек
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Настройки для логирования в тестах
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Настройки для параллельного запуска тестов (если установлен pytest-xdist)
# addopts = -n auto

# Минимальная версия pytest
minversion = 7.0

# Паттерны для поиска тестовых файлов
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Настройки для отчетов
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true